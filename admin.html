<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>더큰코리아 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
<div class="wrap">

  <div id="loginScreen" class="card">
    <div class="logo">더큰코리아</div>
    <div class="title">관리자 로그인</div>
    <div class="desc">출퇴근 통합 관리 시스템</div>

    <input type="password" id="adminPassword" placeholder="관리자 비밀번호 입력">
    <button id="loginBtn" class="btn-login" onclick="adminLogin()">로그인</button>

    <div id="loginMessage" class="message"></div>
  </div>

  <div id="adminScreen" class="hidden">

    <div class="top-bar">
      <div>
        <div class="logo small">더큰코리아</div>
        <div class="top-title">출퇴근 관리자</div>
      </div>

      <button class="logout-btn" onclick="logoutAdmin()">로그아웃</button>
    </div>

    <div class="card">
      <div class="section-title">오늘 출퇴근 현황</div>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <div class="dashboard-number" id="totalCount">0</div>
          <div class="dashboard-label">전체 기록</div>
        </div>

        <div class="dashboard-card">
          <div class="dashboard-number" id="checkInCount">0</div>
          <div class="dashboard-label">출근</div>
        </div>

        <div class="dashboard-card">
          <div class="dashboard-number" id="checkOutCount">0</div>
          <div class="dashboard-label">퇴근</div>
        </div>

        <div class="dashboard-card">
          <div class="dashboard-number" id="workingCount">0</div>
          <div class="dashboard-label">근무중</div>
        </div>
      </div>

      <div class="sub-title">현재 근무중 직원</div>
      <div id="workingList">
        <div class="empty">근무중 직원이 없습니다.</div>
      </div>

      <div class="sub-title">지점별 출근 현황</div>
      <div id="storeSummary">
        <div class="empty">지점별 데이터가 없습니다.</div>
      </div>

      <button class="refresh-btn" onclick="loadTodayEmployees()">새로고침</button>

      <div id="todayList">
        <div class="empty">데이터 불러오는 중...</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">월 근무 요약 대시보드</div>

      <label class="form-label">조회 월</label>
      <input type="month" id="summaryMonth">

      <button class="search-btn" onclick="loadMonthlySummary()">월 근무 요약 조회</button>

      <div id="monthlySummaryResult">
        <div class="empty">월 근무 요약을 조회해주세요.</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">월 급여 계산</div>

      <label class="form-label">급여 계산 월</label>
      <input type="month" id="payrollMonth">

      <label class="form-label">직원명 검색</label>
      <input type="text" id="payrollKeyword" placeholder="예: 박상신">

      <label class="form-label">점포 선택</label>
      <select id="payrollStoreSelect">
        <option value="">전체 점포</option>
      </select>

      <button class="search-btn" onclick="loadPayrollSummary()">월 급여 계산</button>
      <button class="excel-btn" onclick="downloadPayrollExcel()">
         급여대장 엑셀 다운로드
      </button>

      <div id="payrollResult">
        <div class="empty">월 급여를 계산해주세요.</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">날짜 / 점포별 조회</div>

      <button class="excel-btn" onclick="downloadMonthlyExcel()">월별 엑셀 다운로드</button>

      <label class="form-label">조회 날짜</label>
      <input type="date" id="searchDate">

      <label class="form-label">직원명 검색</label>
      <input type="text" id="searchName" placeholder="직원 이름 입력">

      <label class="form-label">점포 선택</label>
      <select id="storeSelect">
        <option value="">전체 점포</option>
      </select>

      <button class="search-btn" onclick="searchAttendanceByDate()">조회하기</button>

      <div id="storeResult">
        <div class="empty">조회 조건을 선택해주세요.</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">직원 현황</div>

      <label class="form-label">직원명 검색</label>
      <input type="text" id="employeeKeyword" placeholder="직원 이름 입력">

      <button class="search-btn" onclick="loadEmployees()">직원 조회</button>

      <div id="employeeResult">
        <div class="empty">직원을 조회해주세요.</div>
      </div>
    </div>

  </div>
</div>

<script src="admin.js?v=20260512-4"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
