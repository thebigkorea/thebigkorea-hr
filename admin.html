<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>더큰코리아 관리자</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="wrap">

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="card">

    <div class="logo">
      더큰코리아
    </div>

    <div class="title">
      관리자 로그인
    </div>

    <div class="desc">
      출퇴근 통합 관리 시스템
    </div>

    <input
      type="password"
      id="adminPassword"
      placeholder="관리자 비밀번호 입력"
    >

    <button
      id="loginBtn"
      class="btn-login"
      onclick="adminLogin()"
    >
      로그인
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

  <!-- 관리자 화면 -->
  <div id="adminScreen" class="hidden">

    <div class="top-bar">

      <div>
        <div class="logo small">
          더큰코리아
        </div>

        <div class="top-title">
          출퇴근 관리자
        </div>
      </div>

      <button
        class="logout-btn"
        onclick="logoutAdmin()"
      >
        로그아웃
      </button>

    </div>

    <!-- 오늘 출근 현황 -->
    <div class="card">

      <div class="section-title">
        오늘 출퇴근 현황
      </div>

      <button
        class="refresh-btn"
        onclick="loadTodayEmployees()"
      >
        새로고침
      </button>

      <div id="todayList">

        <div class="empty">
          데이터 불러오는 중...
        </div>

      </div>

    </div>

    <!-- 점포별 조회 -->
    <div class="card">

      <div class="section-title">
        점포별 조회
      </div>

      <select id="storeSelect">
        <option value="">
          전체 점포
        </option>
      </select>

      <button
        class="search-btn"
        onclick="searchStoreAttendance()"
      >
        조회하기
      </button>

      <div id="storeResult">

        <div class="empty">
          점포를 조회해주세요.
        </div>

      </div>

    </div>

  </div>

</div>

<script src="admin.js"></script>

</body>
</html>
