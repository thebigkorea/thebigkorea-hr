<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자계약 선택</title>

<style>
body{
  margin:0;
  background:#f4f6f9;
  font-family:Pretendard,sans-serif;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:20px;
}
.title{
  font-size:32px;
  font-weight:900;
  color:#173b72;
  margin-bottom:24px;
  line-height:1.35;
}
.card{
  background:#fff;
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
.menu-btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:22px;
  background:#174a9c;
  color:#fff;
  font-size:21px;
  font-weight:900;
}
.sub{
  margin-top:10px;
  font-size:15px;
  color:#666;

<body>
<div class="wrap">

<div class="title">
더큰코리아<br>
전자계약 선택
</div>

<div class="card">
  <button class="menu-btn" onclick="location.href='regular-contract.html'">
    정규직 근로계약서
  </button>
  <div class="sub">월급제 / 정규직 직원용</div>
</div>

<div class="card">
  <button class="menu-btn" onclick="location.href='part-contract.html'">
    계약직 · 아르바이트 근로계약서
  </button>
  <div class="sub">시급제 / 단시간 근로자용</div>
</div>

<div class="card">
  <button class="menu-btn" onclick="location.href='service-contract.html'">
    사업소득자 용역계약서
  </button>
  <div class="sub">3.3% 사업소득자 / 용역 제공자용</div>
</div>

</div>

</html>
