<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>근로계약 조회</title>

<style>
body{margin:0;background:#f4f6f9;font-family:Pretendard,sans-serif;}
.wrap{max-width:520px;margin:0 auto;padding:20px;}
.title{font-size:32px;font-weight:900;color:#173b72;margin-bottom:24px;}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
.input{width:100%;padding:18px;border-radius:16px;border:1px solid #ddd;margin-bottom:16px;font-size:18px;box-sizing:border-box;}
.btn{width:100%;border:none;border-radius:18px;padding:20px;background:#174a9c;color:#fff;font-size:22px;font-weight:900;}
.result{margin-top:24px;}
.empty{text-align:center;padding:30px;color:#777;}
.contract-btn{display:block;text-align:center;text-decoration:none;background:#0f7b46;color:#fff;border-radius:18px;padding:20px;font-size:22px;font-weight:900;}
</style>
</head>

<body>
<div class="wrap">

<div class="title">근로계약 조회</div>

<div class="card">
  <input id="name" class="input" placeholder="직원명">
  <input id="phone" class="input" placeholder="전화번호">
  <input id="password" type="password" class="input" placeholder="개인 비밀번호" autocomplete="new-password">
  <button class="btn" onclick="loadContract()">근로계약 조회</button>
</div>

<div id="result" class="result"></div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbyriJGrYUjjWwnnb7L8HEUHgoRXXo_ma-aOTQi8fqpVomQfxbmBE18YH9LmWEHrKENsWA/exec";

async function apiRequest(data){
  const response = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });
  return await response.json();
}

async function loadContract(){
  const box = document.getElementById("result");

  box.innerHTML = `<div class="empty">조회 중...</div>`;

  try{
    const result = await apiRequest({
      action:"getEmployeeContractInfo",
      name:document.getElementById("name").value,
      phone:document.getElementById("phone").value,
      password:document.getElementById("password").value
    });

    if(!result.success){
      box.innerHTML = `<div class="empty">${result.message || "조회 실패"}</div>`;
      return;
    }

    box.innerHTML = `
      <div class="card">
        <div style="font-size:24px;font-weight:900;margin-bottom:16px;">
          ${result.name} 근로계약서
        </div>
        <a class="contract-btn" href="${result.contractUrl}" target="_blank">
          계약서 열기
        </a>
      </div>
    `;
  }
  catch(err){
    console.error(err);
    box.innerHTML = `<div class="empty">조회 실패</div>`;
  }
}
</script>

</body>
</html>
