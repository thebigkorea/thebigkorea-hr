<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>더큰코리아 직원포털</title>

<style>
body{
  margin:0;
  background:#f4f6f9;
  font-family:Pretendard,sans-serif;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:20px;
}
.title{
  font-size:32px;
  font-weight:900;
  margin-bottom:24px;
  color:#173b72;
  line-height:1.35;
}
.card{
  background:#fff;
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
.label{
  font-weight:900;
  margin-bottom:10px;
}
.select{
  width:100%;
  padding:18px;
  border-radius:16px;
  border:1px solid #ddd;
  font-size:18px;
  margin-bottom:14px;
}
.menu-btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:22px;
  margin-bottom:14px;
  background:#174a9c;
  color:#fff;
  font-size:22px;
  font-weight:900;
}
.reset-btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  background:#888;
  color:#fff;
  font-size:15px;
  font-weight:800;
}
.sub{
  font-size:15px;
  color:#666;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="wrap">

<div id="portalTitle" class="title">
더큰코리아<br>직원포털
</div>

<div id="storeSetup" class="card">
  <div class="label">소속 점포 선택</div>

  <select id="storeSelect" class="select">
    <option value="">점포를 선택하세요</option>
    <option value="본사">본사</option>
    <option value="한국의집 롯데월드몰점">한국의집 롯데월드몰점</option>
    <option value="길채정 압구정점">길채정 압구정점</option>
    <option value="소바공방 평촌점">소바공방 평촌점</option>
  </select>

  <button class="menu-btn" onclick="saveStore()">
    점포 등록
  </button>
</div>

<div id="menuArea" style="display:none;">

  <div class="card">
    <button class="menu-btn" onclick="location.href='https://thebigkorea.github.io/thebigkorea-hr/'">
      출퇴근
    </button>
    <div class="sub">출근 / 퇴근 등록</div>
  </div>

  <div class="card">
    <button class="menu-btn" onclick="location.href='https://thebigkorea.github.io/thebigkorea-hr/payroll.html'">
      급여명세서
    </button>
    <div class="sub">월 급여명세서 조회</div>
  </div>

  <div class="card">
    <button class="menu-btn" onclick="location.href='https://thebigkorea.github.io/thebigkorea-hr/leave.html'">
      연차조회
    </button>
    <div class="sub">잔여 연차 및 사용내역</div>
  </div>

  <div class="card">
    <button class="menu-btn" onclick="location.href='https://thebigkorea.github.io/thebigkorea-hr/contract.html'">
      근로계약
    </button>
    <div class="sub">전자근로계약 조회</div>
  </div>

  <button class="reset-btn" onclick="resetStore()">
    소속 점포 변경
  </button>

</div>

</div>

<script>
function saveStore(){
  const store = document.getElementById("storeSelect").value;

  if(!store){
    alert("점포를 선택해주세요.");
    return;
  }

  localStorage.setItem("tk_portal_store", store);
  applyStore();
}

function resetStore(){
  localStorage.removeItem("tk_portal_store");
  location.reload();
}

function applyStore(){
  const store = localStorage.getItem("tk_portal_store");

  if(store){
    document.getElementById("portalTitle").innerHTML =
      "더큰코리아<br>" + store + "<br>직원포털";

    document.getElementById("storeSetup").style.display = "none";
    document.getElementById("menuArea").style.display = "block";
  }
}

window.onload = applyStore;
</script>

</body>
</html>
